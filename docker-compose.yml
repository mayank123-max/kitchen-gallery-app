services:
  db:
    image: postgres:15-alpine
    container_name: kitchen_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: kitchen_gallery
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: kitchen_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://admin:adminpassword@db:5432/kitchen_gallery
    volumes:
      - ./backend:/app
    depends_on:
      - db

volumes:
  postgres_data: